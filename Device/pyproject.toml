[project]
name = "smart-warehouse-device"
version = "0.1.0"
description = "Smart Warehouse shelf agent (Raspberry Pi 5) and its PC emulator"
# Raspberry Pi OS Bookworm ships Python 3.11, and picamera2 is only available
# as a system package there, so 3.11 is the floor (see ADR-0008).
requires-python = ">=3.11"

[project.scripts]
shelf-agent = "shelf_agent.cli:main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["shelf_agent"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["\\.venv/"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]
