# Shelf device configuration. Copy to config/device.toml (gitignored) and edit.
#
#   SW_DEVICE_KEY=... python -m shelf_agent run --config config/device.toml
#
# The device key is read from the environment, never from this file (NFR-03).
# Relative paths are resolved against this file's directory.

[backend]
base_url = "http://192.168.1.10:8080"
timeout_s = 10
# "image-events": POST /image-events {deviceId, imagePath, capturedAt}, as in
#                 the backend's Swagger (/swagger-ui.html). The image stays in
#                 [camera] capture_dir; its path is sent.
# "device-images": uploads the image to POST /devices/{id}/images; the backend
#                 recognises it and updates the shelf stock. Raise timeout_s:
#                 recognition takes several seconds.
# "multipart":    RFC-0001 upload of the image itself, once the backend has it.
protocol = "image-events"
# capturedAt is a LocalDateTime (no zone): "local" matches the backend's own
# receivedAt clock when both run in the same timezone; "utc" otherwise.
timestamp_zone = "local"
# image_events_path = "/image-events"
# device_images_path = "/devices/{device_id}/images"
# devices_path = "/devices"
# heartbeat_path = "/devices/{device_id}/heartbeat"
# upload_path = "/api/v1/device-events/images"

[device]
# The shelf must exist in the backend. The device id is generated by the
# backend: leave device_id out and the agent looks it up by its key on start.
# Set it only to start without network (frames then queue until it's back).
shelf_id = 1
# device_id = 1
device_key_env = "SW_DEVICE_KEY"
# Create the device with POST /devices if the key is unknown. Normally an
# administrator registers devices; keep this off on real shelves.
register = false
heartbeat_interval_s = 30
# Undelivered frames survive reboots here. On the Pi use a path under /var/lib.
outbox_dir = "../.outbox"

[camera]
# "picamera" on the Raspberry Pi; "folder" replays images from `folder`,
# which runs this exact entry point on a PC.
type = "picamera"
width = 2304
height = 1296
# Stills are kept here; their path is what "image-events" reports.
capture_dir = "../.captures"
# folder = "../scenarios/smoke/images"
# loop = false

[trigger]
# "gpio"     - shelf sensor on `pin` (BCM); capture `settle_s` after release
# "interval" - every `interval_s` seconds
# "manual"   - press Enter (bring-up / debugging)
type = "gpio"
pin = 17
settle_s = 2.0
interval_s = 60
