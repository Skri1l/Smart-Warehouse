# Diploma demo: emulated shelf replaying the labelled Coca-Cola photos.
#
#   python -m shelf_agent emulate --scenario scenarios/demo/scenario.toml
#
# The shelves (shelf_id) must exist in the backend. Devices are registered
# automatically by device_key (disable with --no-register).
#
# Frames are listed explicitly: the files are named 1..25, and a glob would
# sort them as text (1, 10, 11, ..., 2). The backend derives the stock change
# from consecutive frames, so the order below is the order the shelf changed.
#
# To show more shelves, add another [[shelves]] block with its own ids and
# key. It can reuse a subset of the photos.

images_dir = "images"
labels = "labels.csv"
# Used with --auto: seconds between frames of one shelf.
interval_s = 15
heartbeat_interval_s = 30

[backend]
base_url = "http://127.0.0.1:8080"
# upload_path = "/api/v1/device-events/images"
# heartbeat_path = "/devices/{device_id}/heartbeat"

# The physical shelf is shelf 1, so emulated ones start at 2. Device ids are
# generated by the backend; the emulator looks them up by device_key and
# registers missing devices (POST /devices) unless register_devices = false.
[[shelves]]
name = "A2"
shelf_id = 2
device_key = "emulator-a2"
frames = [
    "1.jpg",
    "2.jpg",
    "3.jpg",
    "4.jpg",
    "5.jpg",
    "6.jpg",
    "7.jpg",
    "8.jpg",
    "9.jpg",
    "10.jpg",
    "11.jpg",
    "12.jpg",
    "13.jpg",
    "14.jpg",
    "15.jpg",
    "16.jpg",
    "17.jpg",
    "18.jpg",
    "19.jpg",
    "20.jpg",
    "21.jpg",
    "22.jpg",
    "23.jpg",
    "24.jpg",
    "25.jpg",
]
