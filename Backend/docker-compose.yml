services:
  postgres:
    image: postgres:17
    container_name: smart-warehouse-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  vision:
    build:
      context: ../Vision
      dockerfile: Dockerfile
    image: smart-warehouse-vision:local
    container_name: smart-warehouse-vision

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s

    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: smart-warehouse-backend

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      VISION_BASE_URL: http://vision:8000
      VISION_IMAGE_DIRECTORY: /app/uploads/camera

    ports:
      - "${BACKEND_PORT}:8080"

    volumes:
      - camera_images:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      vision:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data:
  camera_images:
