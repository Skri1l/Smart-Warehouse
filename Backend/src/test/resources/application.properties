# Test-only datasource. Production/dev use PostgreSQL (see src/main/resources).
# H2 is sufficient here because this only backs the context-load smoke test;
# real integration tests (*IT) should use Testcontainers with PostgreSQL per
# ../../../../../../Documentation/CODE_STYLE_BACKEND.md, not this file.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
