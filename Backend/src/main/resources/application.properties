spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_warehouse}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smart_warehouse}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smart_warehouse}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

vision.base-url=${VISION_BASE_URL:http://127.0.0.1:8000}

spring.jpa.open-in-view=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

vision.image-directory=uploads/camera

spring.web.error.include-message=always
