name: Frontend CI

on:
  pull_request:
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "Frontend/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries
        # PySide6 wheels link against these even with QT_QPA_PLATFORM=offscreen;
        # ubuntu-latest does not ship them (ImportError: libEGL.so.1).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: |
          if find . -name "*.py" | grep -q .; then
            mypy .
          else
            echo "No Python files yet — skipping."
          fi

      - name: Tests (pytest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest
          else
            echo "No tests yet — skipping."
          fi

      - name: Dependency license audit (pip-licenses)
        run: |
          # PySide6/shiboken6 report a multi-license classifier
          # ("LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only") because Qt is
          # dual/triple-licensed; this project uses them under the LGPL-3.0
          # branch (see ADR-0006 and THIRD_PARTY_NOTICES.md), so they are
          # excluded from this automated check and reviewed manually instead.
          # Anything else reporting GPL/AGPL fails the build.
          pip-licenses --ignore-packages PySide6 shiboken6 \
            --fail-on="GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3"
