name: Frontend CI

on:
  pull_request:
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "Frontend/**"

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency license audit (license-checker)
        # Proprietary project: only permissive licenses in shipped (production) dependencies.
        run: npm run licenses
