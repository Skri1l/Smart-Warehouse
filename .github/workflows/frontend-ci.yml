name: Frontend CI

on:
  pull_request:
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "Frontend/**"

jobs:
  lint-test-build:
    # Pinned: ubuntu-latest is 26.04, where Playwright 1.55 cannot install Chromium
    # ("Playwright does not support chromium on ubuntu26.04-x64"). Move to ubuntu-latest
    # together with a Playwright upgrade that supports it.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright, mock backend)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Frontend/playwright-report
          retention-days: 7

      - name: Dependency license audit (license-checker)
        # Proprietary project: only permissive licenses in shipped (production) dependencies.
        run: npm run licenses
