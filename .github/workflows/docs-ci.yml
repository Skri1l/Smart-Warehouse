name: Docs CI

on:
  pull_request:
    paths:
      - "**/*.md"
  push:
    branches: [main, develop]
    paths:
      - "**/*.md"

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --exclude-mail
            --exclude "http://localhost*"
            --exclude "https://localhost*"
            '**/*.md'
          fail: true
