name: Docs CI

on:
  pull_request:
    paths:
      - "**/*.md"
      - "Website/**/*.html"
  push:
    branches: [main, develop]
    paths:
      - "**/*.md"
      - "Website/**/*.html"

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          # Local service URLs (Swagger on 127.0.0.1:8080, Vision on :8000)
          # are documentation, not links CI can reach.
          args: >
            --no-progress
            --exclude-loopback
            --exclude "http://localhost*"
            --exclude "https://localhost*"
            '**/*.md'
            'Website/**/*.html'
          fail: true
