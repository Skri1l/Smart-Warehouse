name: Vision CI

on:
  pull_request:
    paths:
      - "Vision/**"
      - ".github/workflows/vision-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "Vision/**"

permissions:
  contents: read

concurrency:
  group: vision-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Vision
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Same version as the Docker image.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Vision/requirements-docker.txt
            Vision/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Tests without the model (API, labels, box filtering)
        run: pytest -m "not slow"

  accuracy:
    # Runs the real YOLO-World model on the 25 labelled photos (ADR-0010).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Vision
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Vision/requirements-docker.txt
            Vision/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # YOLO-World weights (~140 MB) land in Vision/, the CLIP text encoder
      # (~340 MB) in ~/.cache/clip. Bump the key when MODEL_PATH changes.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            Vision/yolov8x-worldv2.pt
            ~/.cache/clip
          key: vision-weights-yolov8x-worldv2-clip-vitb32

      - name: Accuracy on labelled photos
        run: pytest -m slow -v
