<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 580" width="620" height="580" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <!-- Plan view from above, front of the shelf at the bottom. 1 unit = 1 mm.
       Mapping: X = 300 + x, Y = 420 - y. Ceiling parts are dashed. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <clipPath id="sheet"><rect x="0" y="40" width="620" height="540"/></clipPath>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c9a400" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="620" height="580" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#111">Demo shelf — plan view (dimensions in mm)</text>

  <!-- camera footprint on the floor plane (clipped) -->
  <polygon clip-path="url(#sheet)" points="-113,474 713,474 1223,-352 -623,-352" fill="#4c8ed9" fill-opacity="0.10" stroke="#4c8ed9" stroke-width="1"/>
  <text x="20" y="488" fill="#2c6cb0" font-size="11">near edge of frame at floor level, y = −54</text>

  <!-- floor tiles -->
  <rect x="100" y="110" width="400" height="320" fill="#d7dade" stroke="#555"/>
  <line x1="300" y1="110" x2="300" y2="430" stroke="#777" stroke-dasharray="6 4"/>
  <line x1="100" y1="270" x2="500" y2="270" stroke="#777" stroke-dasharray="6 4"/>
  <g fill="#666" font-size="11" text-anchor="middle">
    <text x="200" y="200">floor tile A</text><text x="200" y="214">200 × 160</text>
    <text x="400" y="200">floor tile B (mirror)</text><text x="400" y="214">200 × 160</text>
    <text x="200" y="335">floor tile B (mirror)</text>
    <text x="400" y="335">floor tile A</text>
  </g>

  <!-- working area -->
  <rect x="100" y="120" width="400" height="300" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="300" y="300" fill="#2e7d32" text-anchor="middle" font-weight="bold">working area 400 × 300, products ≤ 180 high</text>

  <!-- corner bosses and columns -->
  <g fill="#b0b6bd" stroke="#555">
    <rect x="100" y="402" width="28" height="28"/><rect x="472" y="402" width="28" height="28"/>
    <rect x="100" y="110" width="28" height="28"/><rect x="472" y="110" width="28" height="28"/>
  </g>
  <g fill="#6d747c" stroke="#333">
    <rect x="104" y="406" width="20" height="20"/><rect x="476" y="406" width="20" height="20"/>
    <rect x="104" y="114" width="20" height="20"/><rect x="476" y="114" width="20" height="20"/>
  </g>
  <text x="154" y="384" fill="#555" font-size="11">corner boss 28×28</text>
  <text x="154" y="397" fill="#555" font-size="11">column 20 × 20</text>

  <!-- back panel and front lip -->
  <rect x="128" y="113.3" width="344" height="3.4" fill="#5f6770"/>
  <rect x="128" y="423.3" width="344" height="3.4" fill="#5f6770"/>
  <text x="300" y="104" fill="#333" text-anchor="middle" font-size="11">back panel 2 × 172 wide (background, shear wall)</text>
  <text x="128" y="444" fill="#333" font-size="11">front lip / label strip 2 × 172</text>

  <!-- LED bars under the ceiling -->
  <rect x="131.5" y="150" width="17" height="240" fill="url(#hatch)" stroke="#c9a400" stroke-dasharray="4 2"/>
  <rect x="451.5" y="150" width="17" height="240" fill="url(#hatch)" stroke="#c9a400" stroke-dasharray="4 2"/>
  <text x="155" y="160" fill="#8a6d00" font-size="11">LED bar, 240 long, tilted 45° inward</text>

  <!-- head unit on the ceiling + camera -->
  <rect x="245" y="310" width="110" height="140" fill="none" stroke="#6b7f99" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="300" y="365" fill="#6b7f99" text-anchor="middle" font-size="11">head unit</text>
  <text x="300" y="379" fill="#6b7f99" text-anchor="middle" font-size="11">(Pi 5 on ceiling top)</text>
  <rect x="287.5" y="444" width="25" height="12" fill="#2e7d32" stroke="#1b5e20"/>
  <circle cx="300" cy="450" r="3" fill="#d32f2f"/>
  <line x1="300" y1="440" x2="300" y2="400" stroke="#d32f2f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="318" y="462" fill="#b71c1c">camera, lens at x 0, y −30</text>

  <!-- dimensions -->
  <g stroke="#333" stroke-width="0.8" fill="none">
    <line x1="100" y1="510" x2="500" y2="510" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="100" y1="430" x2="100" y2="516" stroke-dasharray="2 2"/>
    <line x1="500" y1="430" x2="500" y2="516" stroke-dasharray="2 2"/>
    <line x1="114" y1="545" x2="486" y2="545" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="114" y1="426" x2="114" y2="551" stroke-dasharray="2 2"/>
    <line x1="486" y1="426" x2="486" y2="551" stroke-dasharray="2 2"/>
    <line x1="50" y1="110" x2="50" y2="430" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="44" y1="110" x2="100" y2="110" stroke-dasharray="2 2"/>
    <line x1="44" y1="430" x2="100" y2="430" stroke-dasharray="2 2"/>
    <line x1="80" y1="120" x2="80" y2="420" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="74" y1="120" x2="100" y2="120" stroke-dasharray="2 2"/>
    <line x1="74" y1="420" x2="100" y2="420" stroke-dasharray="2 2"/>
    <line x1="540" y1="420" x2="540" y2="450" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="312" y1="450" x2="546" y2="450" stroke-dasharray="2 2"/>
    <line x1="500" y1="420" x2="546" y2="420" stroke-dasharray="2 2"/>
  </g>
  <g fill="#111" text-anchor="middle">
    <text x="300" y="505">overall width 400 = working width</text>
    <text x="300" y="540">column centres 372 (x = ±186)</text>
    <text x="44" y="270" transform="rotate(-90 44 270)">overall depth 320</text>
    <text x="74" y="270" transform="rotate(-90 74 270)">working depth 300</text>
    <text x="566" y="439">30</text>
  </g>
</svg>
