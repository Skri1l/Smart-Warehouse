openapi: 3.1.0
info:
  title: Smart Warehouse API
  version: 0.0.1
  summary: Warehouse layout, stock, shelf cameras, recognition and purchasing.
  description: |-
    REST API of the Smart Warehouse backend (Spring Boot). It manages the warehouse layout
    (warehouses → racks → shelves), the product catalogue, stock on shelves, shelf cameras
    and their photos, recognition results, and purchasing (demand plans → replenishment
    recommendations → purchase orders).

    **New here?** Start with the [Getting Started guide](https://github.com/Skri1l/Smart-Warehouse/blob/main/Documentation/api/GETTING_STARTED.md),
    then follow the tutorial [Connect a shelf camera](https://github.com/Skri1l/Smart-Warehouse/blob/main/Documentation/api/tutorials/connect-shelf-camera.md).

    ## Conventions

    | Topic | Rule |
    |---|---|
    | Base URL | `http://localhost:8080` when run locally. All paths start at the root (no `/api/v1` prefix yet). |
    | Format | JSON (`application/json`) in and out; camera photos are `multipart/form-data`. |
    | Authentication | None yet — every endpoint is open in development. Do not expose this build publicly. |
    | Create | `POST` returns **201** and the new resource **ID as a bare number** (e.g. `7`), not the object. Fetch it with `GET /{resource}/{id}`. |
    | Update / delete | `PUT` replaces the whole resource and returns it (**200**); `DELETE` and status actions (`PATCH …/activate`) return **204** with no body. |
    | Lists | Plain JSON arrays, not paginated yet. |
    | Dates | `date` = `YYYY-MM-DD`; `date-time` = `YYYY-MM-DDThh:mm:ss` in server local time, without a timezone. |

    ## Errors

    Business errors (not found, conflict, Vision failure) use `ErrorResponse`:

    ```json
    { "status": 404, "message": "Product is not found" }
    ```

    Request errors detected by Spring before the controller runs (invalid body, wrong
    parameter type, missing parameter, wrong content type) use the Spring Boot error body
    `SpringErrorResponse`:

    ```json
    { "timestamp": "2026-11-23T20:38:10.000Z", "status": 400, "error": "Bad Request",
      "message": "Validation failed for object='productRequestDto'. Error count: 2", "path": "/products" }
    ```

    | Status | Meaning | Body |
    |---|---|---|
    | 400 | Invalid JSON, failed validation (`@NotBlank`, `@Positive`, `@FutureOrPresent`…), wrong or missing parameter | `SpringErrorResponse` |
    | 404 | The resource or a referenced resource (e.g. `productId`) does not exist | `ErrorResponse` |
    | 409 | Duplicate (SKU, device key, user e-mail/username, warehouse name + address) or a state conflict | `ErrorResponse` |
    | 415 | Wrong `Content-Type` (e.g. JSON sent to the photo upload) | `SpringErrorResponse` |
    | 500 | Unexpected server error | `SpringErrorResponse` |
    | 502 | The Vision service is unreachable or returned an invalid count | `ErrorResponse` |
  license:
    name: Proprietary — see LICENSE
    url: https://github.com/Skri1l/Smart-Warehouse/blob/main/LICENSE
tags:
  - name: Warehouses
    description: Warehouses (sites). Unique by name + address.
  - name: Racks
    description: Racks inside a warehouse. A rack holds shelves.
  - name: Shelves
    description: Shelves on a rack. One shelf holds one product and has at most one camera.
  - name: Products
    description: Product catalogue. `sku` is unique.
  - name: Shelf Stock
    description: How many units of a product lie on a shelf, with expiry date. Camera processing needs exactly one stock record per shelf.
  - name: Stock
    description: Aggregated stock per SKU across all shelves (used by the Planning service).
  - name: Stock Movements
    description: "Audit log of every stock change: receipts, removals, transfers, write-offs and camera adjustments."
  - name: Devices
    description: Shelf cameras (Raspberry Pi agents). A device is created `INACTIVE`; it becomes `ACTIVE` with `activate` or its first `heartbeat`.
  - name: Camera Images
    description: Photo upload from a shelf camera. The backend saves the photo, asks the Vision service to count items and updates stock in one step.
  - name: Image Events
    description: Every photo received from a camera, with its processing status.
  - name: Recognition Results
    description: "What the Vision service saw on a photo: detected quantity, change and status."
  - name: Demand Plans
    description: "Expected demand: how many units of a product are needed by a date."
  - name: Replenishment Recommendations
    description: Suggested purchases calculated from stock and demand. A manager approves, rejects or edits them.
  - name: Purchase Orders
    description: Orders placed from an approved recommendation (one order per recommendation).
  - name: Users
    description: "Users of the web UI. Roles: `WORKER`, `MANAGER`, `ADMIN`. New users are `WORKER`/`ACTIVE`."
