  /devices/{deviceId}/images:
    post:
      tags:
        - Camera Images
      operationId: uploadImage
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the camera (from `POST /devices`).
          example: 1
        - name: capturedAt
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: When the photo was taken, camera local time.
          example: 2026-11-23T10:15:00
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG or PNG photo of the shelf, up to 10 MB.
              required:
                - file
            encoding:
              file:
                contentType: image/jpeg, image/png
      responses:
        "200":
          description: Photo processed; stock updated to the counted quantity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraImageResponseDto"
        "400":
          description: Missing or invalid `capturedAt`, or an empty file (`Image is empty`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpringErrorResponse"
              example:
                timestamp: 2026-11-23T20:38:10.000Z
                status: 400
                error: Bad Request
                message: Required parameter 'capturedAt' is not present.
                path: /devices/1/images
        "404":
          description: Device does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 404
                message: "Device not found: 42"
        "409":
          description: Device is inactive (`Device is inactive`), the shelf does not have exactly one stock record (`Camera processing requires exactly one stock record on the shelf`), or the photo is older than one already processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 409
                message: An image with the same or a later capture time was already processed
        "415":
          description: The request is not `multipart/form-data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpringErrorResponse"
              example:
                timestamp: 2026-11-23T20:38:10.000Z
                status: 415
                error: Unsupported Media Type
                message: Content-Type 'application/json' is not supported.
                path: /devices/1/images
        "502":
          description: Vision service is down or returned an invalid count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 502
                message: Vision service request failed
      summary: Upload a shelf photo from a camera
      description: |-
        Called by the shelf agent after it takes a photo. In one transaction the backend:

        1. checks the device exists and is `ACTIVE`, and that its shelf has **exactly one** stock record;
        2. saves the photo and sends it to the Vision service (`POST /recognize`), which returns the item count;
        3. creates an image event (`PROCESSED`) and a `CONFIRMED` recognition result;
        4. sets the shelf stock to the counted quantity and, if it changed, writes an `ADJUSTMENT` stock movement with source `CAMERA`;
        5. updates the device's `lastSeenAt`.

        Photos must arrive in capture order: a photo older than (or as old as) one already processed for the shelf is rejected with 409.

        ```bash
        curl -X POST "http://localhost:8080/devices/1/images?capturedAt=2026-11-23T10:15:00" \
          -F "file=@shelf-a1.jpg;type=image/jpeg"
        ```
