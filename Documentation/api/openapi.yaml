components:
  schemas:
    WarehouseRequestDTO:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
      required:
        - address
        - name
      example:
        name: Central warehouse
        address: Gedimino pr. 1, Vilnius
    WarehouseResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
      example:
        id: 1
        name: Central warehouse
        address: Gedimino pr. 1, Vilnius
    UserRequestDTO:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          description: Plain text in the request; stored as a BCrypt hash, never returned.
      required:
        - email
        - password
        - username
      example:
        email: anna@example.com
        username: anna
        password: S3cure-passw0rd
    UserResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - WORKER
            - MANAGER
        status:
          type: string
          enum:
            - ACTIVE
            - BLOCKED
      example:
        id: 1
        email: anna@example.com
        username: anna
        role: WORKER
        status: ACTIVE
    ShelfRequestDto:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        capacity:
          type: integer
          format: int32
          exclusiveMinimum: 0
          description: Maximum number of units the shelf holds. Must be > 0.
        rackId:
          type: integer
          format: int64
      required:
        - capacity
        - label
        - rackId
      example:
        label: A-1
        capacity: 120
        rackId: 1
    ShelfResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        capacity:
          type: integer
          format: int32
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          description: "`INACTIVE` shelves are hidden from operations until activated."
        rackId:
          type: integer
          format: int64
      example:
        id: 1
        label: A-1
        capacity: 120
        status: ACTIVE
        rackId: 1
    ShelfStockRequestDto:
      type: object
      properties:
        shelfId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          exclusiveMinimum: 0
          description: Units on the shelf. Must be > 0.
        expirationDate:
          type: string
          format: date
          description: Today or later.
      required:
        - expirationDate
        - productId
        - quantity
        - shelfId
      example:
        shelfId: 1
        productId: 1
        quantity: 24
        expirationDate: 2026-12-20
    ShelfStockResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        shelfId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        expirationDate:
          type: string
          format: date
        status:
          type: string
          enum:
            - ACTIVE
            - EXPIRED
          description: "`EXPIRED` once `expirationDate` has passed."
      example:
        id: 1
        shelfId: 1
        productId: 1
        quantity: 24
        expirationDate: 2026-12-20
        status: ACTIVE
    ReplenishmentRecommendationRequestDto:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        recommendedQuantity:
          type: integer
          format: int32
          exclusiveMinimum: 0
        requiredBy:
          type: string
          format: date
          description: Today or later.
        reason:
          type: string
          minLength: 1
          description: Why this quantity is suggested; shown to the manager.
      required:
        - productId
        - reason
        - recommendedQuantity
        - requiredBy
      example:
        productId: 1
        recommendedQuantity: 40
        requiredBy: 2026-12-01
        reason: Below minimum stock
    ReplenishmentRecommendationResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        recommendedQuantity:
          type: integer
          format: int32
        requiredBy:
          type: string
          format: date
        reason:
          type: string
        status:
          type: string
          enum:
            - NEW
            - APPROVED
            - REJECTED
            - ORDERED
            - COMPLETED
        createdAt:
          type: string
          format: date-time
      example:
        id: 1
        productId: 1
        recommendedQuantity: 40
        requiredBy: 2026-12-01
        reason: Below minimum stock
        status: NEW
        createdAt: 2026-11-23T10:20:00
    RackRequestDto:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        warehouseId:
          type: integer
          format: int64
          description: "Ignored on create: the warehouse comes from the path."
      required:
        - label
        - warehouseId
      example:
        label: A
        warehouseId: 1
    RackResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        warehouseId:
          type: integer
          format: int64
      example:
        id: 1
        label: A
        warehouseId: 1
    ProductRequestDto:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
          description: Stock keeping unit. Unique across the catalogue.
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - name
        - sku
      example:
        sku: SKU-1001
        name: Milk 1L
        description: UHT milk 3.2%, 1 litre carton
    ProductResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string
        description:
          type: string
      example:
        id: 1
        sku: SKU-1001
        name: Milk 1L
        description: UHT milk 3.2%, 1 litre carton
    DeviceRequestDto:
      type: object
      properties:
        deviceKey:
          type: string
          minLength: 1
          description: Unique key of the camera; the same value goes into the shelf agent config (`device.toml`).
        shelfId:
          type: integer
          format: int64
          description: Shelf the camera photographs. A shelf can have only one camera.
      required:
        - deviceKey
        - shelfId
      example:
        deviceKey: shelf-a1-cam
        shelfId: 1
    DeviceResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        deviceKey:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        lastSeenAt:
          type: string
          format: date-time
          description: Last heartbeat or photo; `null` until the camera first reports.
        shelfId:
          type: integer
          format: int64
      example:
        id: 1
        deviceKey: shelf-a1-cam
        status: ACTIVE
        lastSeenAt: 2026-11-23T10:15:02
        shelfId: 1
    DemandPlanRequestDto:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        requiredDate:
          type: string
          format: date
          description: Today or later.
        requiredQuantity:
          type: integer
          format: int32
          exclusiveMinimum: 0
          description: Must be > 0.
      required:
        - productId
        - requiredDate
        - requiredQuantity
      example:
        productId: 1
        requiredDate: 2026-12-05
        requiredQuantity: 120
    DemandPlanResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        requiredDate:
          type: string
          format: date
        requiredQuantity:
          type: integer
          format: int32
      example:
        id: 1
        productId: 1
        requiredDate: 2026-12-05
        requiredQuantity: 120
    StockMovementRequestDto:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        shelfId:
          type: integer
          format: int64
        quantityDelta:
          type: integer
          format: int32
          description: "Signed change in units: positive adds stock, negative removes it."
        type:
          type: string
          enum:
            - RECEIPT
            - REMOVAL
            - TRANSFER_IN
            - TRANSFER_OUT
            - WRITE_OFF
            - ADJUSTMENT
        source:
          type: string
          enum:
            - MANUAL
            - CAMERA
            - SYSTEM
      required:
        - productId
        - quantityDelta
        - shelfId
        - source
        - type
      example:
        productId: 1
        shelfId: 1
        quantityDelta: -6
        type: REMOVAL
        source: MANUAL
    RecognitionResultRequestDto:
      type: object
      properties:
        imageEventId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        detectedQuantity:
          type: integer
          format: int32
        quantityDelta:
          type: integer
          format: int32
        confidence:
          type: number
          format: double
          description: Model confidence from 0 to 1.
      required:
        - confidence
        - detectedQuantity
        - imageEventId
        - productId
        - quantityDelta
      example:
        imageEventId: 1
        productId: 1
        detectedQuantity: 20
        quantityDelta: -4
        confidence: 0.47
    PurchaseOrderRequestDto:
      type: object
      properties:
        recommendationId:
          type: integer
          format: int64
          description: Only one purchase order can exist per recommendation.
        quantity:
          type: integer
          format: int32
          exclusiveMinimum: 0
      required:
        - quantity
        - recommendationId
      example:
        recommendationId: 1
        quantity: 40
    ImageEventRequestDto:
      type: object
      properties:
        deviceId:
          type: integer
          format: int64
        imagePath:
          type: string
          minLength: 1
        capturedAt:
          type: string
          format: date-time
      required:
        - capturedAt
        - deviceId
        - imagePath
      example:
        deviceId: 1
        imagePath: uploads/camera/2f6c0a8e.image
        capturedAt: 2026-11-23T10:15:00
    CameraImageResponseDto:
      type: object
      properties:
        imageEventId:
          type: integer
          format: int64
        recognitionResultId:
          type: integer
          format: int64
        shelfId:
          type: integer
          format: int64
        previousQuantity:
          type: integer
          format: int32
          description: Shelf stock before this photo.
        quantity:
          type: integer
          format: int32
          description: Units counted by the Vision service; the shelf stock is set to this value.
        quantityDelta:
          type: integer
          format: int32
          description: "`quantity - previousQuantity`. A non-zero delta creates a `CAMERA` stock movement."
      example:
        imageEventId: 1
        recognitionResultId: 1
        shelfId: 1
        previousQuantity: 24
        quantity: 20
        quantityDelta: -4
    ProductStockResponseDto:
      type: object
      properties:
        productSKU:
          type: string
        productRemains:
          type: integer
          format: int32
          description: Sum of `quantity` over all shelf stock records of this SKU.
      example:
        productSKU: SKU-1001
        productRemains: 20
    StockMovementResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        shelfId:
          type: integer
          format: int64
        quantityDelta:
          type: integer
          format: int32
        type:
          type: string
          enum:
            - RECEIPT
            - REMOVAL
            - TRANSFER_IN
            - TRANSFER_OUT
            - WRITE_OFF
            - ADJUSTMENT
        source:
          type: string
          enum:
            - MANUAL
            - CAMERA
            - SYSTEM
        createdAt:
          type: string
          format: date-time
      example:
        id: 1
        productId: 1
        shelfId: 1
        quantityDelta: -4
        type: ADJUSTMENT
        source: CAMERA
        createdAt: 2026-11-23T10:15:02
    RecognitionResultResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        imageEventId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        detectedQuantity:
          type: integer
          format: int32
        quantityDelta:
          type: integer
          format: int32
        confidence:
          type: number
          format: double
          description: Model confidence from 0 to 1; `null` for results created by the camera upload, which are confirmed automatically.
        status:
          type: string
          enum:
            - DETECTED
            - CONFIRMED
            - REJECTED
            - FAILED
      example:
        id: 1
        imageEventId: 1
        productId: 1
        detectedQuantity: 20
        quantityDelta: -4
        confidence: null
        status: CONFIRMED
    PurchaseOrderResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        recommendationId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        status:
          type: string
          enum:
            - CREATED
            - ORDERED
            - RECEIVED
            - CANCELLED
        createdAt:
          type: string
          format: date-time
      example:
        id: 1
        recommendationId: 1
        productId: 1
        quantity: 40
        status: CREATED
        createdAt: 2026-11-23T10:25:00
    ImageEventResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        deviceId:
          type: integer
          format: int64
        shelfId:
          type: integer
          format: int64
        imagePath:
          type: string
          description: Where the backend stored the photo (server-side path).
        capturedAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        processingStatus:
          type: string
          enum:
            - RECEIVED
            - PROCESSING
            - PROCESSED
            - FAILED
      example:
        id: 1
        deviceId: 1
        shelfId: 1
        imagePath: uploads/camera/2f6c0a8e.image
        capturedAt: 2026-11-23T10:15:00
        receivedAt: 2026-11-23T10:15:02
        processingStatus: PROCESSED
    ErrorResponse:
      type: object
      description: Business error produced by `GlobalExceptionHandler`.
      required:
        - status
        - message
      properties:
        status:
          type: integer
          format: int32
          description: HTTP status code, repeated in the body.
        message:
          type: string
          description: Human-readable reason. Do not parse it.
      example:
        status: 404
        message: Product is not found
    SpringErrorResponse:
      type: object
      description: Default Spring Boot error body for request errors (validation, parameter conversion, content type) and unexpected 500s. In a development run with spring-boot-devtools it also contains `errors` (field details) and `trace`.
      required:
        - timestamp
        - status
        - error
        - path
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
          description: HTTP reason phrase.
        message:
          type: string
          description: Reason (enabled by `spring.web.error.include-message=always`).
        path:
          type: string
          description: Request path.
      example:
        timestamp: 2026-11-23T20:38:10.000Z
        status: 400
        error: Bad Request
        message: "Validation failed for object='productRequestDto'. Error count: 2"
        path: /products
servers:
  - url: http://localhost:8080
    description: Local backend (docker compose or ./mvnw spring-boot:run)
security: []
x-tagGroups:
  - name: Warehouse layout
    tags:
      - Warehouses
      - Racks
      - Shelves
  - name: Catalogue & stock
    tags:
      - Products
      - Shelf Stock
      - Stock
      - Stock Movements
  - name: Cameras & recognition
    tags:
      - Devices
      - Camera Images
      - Image Events
      - Recognition Results
  - name: Purchasing
    tags:
      - Demand Plans
      - Replenishment Recommendations
      - Purchase Orders
  - name: Administration
    tags:
      - Users
