[project]
name = "smart-warehouse-frontend"
version = "0.1.0"
description = "Smart Warehouse PySide6 desktop client"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["**/*_ui.py", "**/resources_rc.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "(_ui\\.py$|resources_rc\\.py$)"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["_ui\\.py$", "resources_rc\\.py$"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
qt_api = "pyside6"
